source-file ~/.config/tmux/tmux.conf.default
set -g prefix C-space
unbind-key C-b
bind-key C-space send-prefix

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"
unbind q
bind-key -n M-s command-prompt -p "Enter session name: " "new-session -s '%%'"
bind q command-prompt -p "Enter session name: " "rename-session '%%'"
bind-key -n M-x run-shell "tmux command-prompt -p 'Kill session:' 'confirm-before -p \"Kill session #S (y/n)?\" \"kill-session -t '%%'\"'"
bind-key -n M-q choose-session


unbind M-v
unbind M-h
unbind % # Split vertically
unbind '"' # Split horizontally

bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-h split-window -v -c "#{pane_current_path}"

bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

unbind n
unbind w

bind n command-prompt "rename-window '%%'"
bind w new-window -c "#{pane_current_path}"

set -g base-index 1
set-window-option -g pane-base-index 1

bind -n M-S-Left previous-window
bind -n M-S-Right next-window

bind-key -n M-d kill-pane

set -g mouse on


#########
## PLUGINS ##
#############
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'wfxr/tmux-power'
#set -g @plugin 'hallazzang/tmux-reset'
############
## DESIGN ##
############
#set -g @tmux_power_theme 'sky'

set -g mouse on
set -g default-terminal "tmux-256color"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
# leave this unset to let applications set the window title
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_status "icon"
set -g @catppuccin_window_current_background "#{@thm_mauve}"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_host}"
run '~/.config/tmux/plugins/tpm/tpm'

