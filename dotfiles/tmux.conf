set -g prefix C-space
unbind-key C-b
bind-key C-space send-prefix

# Reload config (updated path to match dotfiles)
bind-key r source-file ~/dotfiles/tmux.conf \; display-message "~/dotfiles/tmux.conf reloaded"

# Unbind default keys to avoid conflicts or accidental triggers
unbind q   # Unbind default q (choose-window)
unbind M-v # Unbind default M-v (if any)
unbind M-h # Unbind default M-h (if any)
unbind %   # Unbind default vertical split
unbind '"' # Unbind default horizontal split
unbind n   # Unbind default n (next window)
unbind w   # Unbind default w (choose window)

# Window move to index (Alt+number)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Example status bar customization (add battery, date, and hostname)
set -g status-right "#(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo N/A)% | %Y-%m-%d %H:%M | #H"

# Note: Ensure TPM is installed at ~/.config/tmux/plugins/tpm or update the path below if needed
run '~/.config/tmux/plugins/tpm/tpm'


unbind M-v
unbind M-h
unbind % # Split vertically
unbind '"' # Split horizontally

bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-h split-window -v -c "#{pane_current_path}"

bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

bind n command-prompt "rename-window '%%'"
bind w new-window -c "#{pane_current_path}"

set -g base-index 1
set-window-option -g pane-base-index 1

bind -n M-S-Left previous-window
bind -n M-S-Right next-window

bind-key -n M-d kill-pane

set -g mouse on

#########
## PLUGINS ##
#############
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'hallazzang/tmux-reset'
############
## DESIGN ##
############
set -g @tmux_power_theme 'sky'

